#http-json
server:
  port: 18333

node:
  storage-path: "./data/solana-node-prod"
  tick-interval-ms: 100
  ticks-per-slot: 8
  max-transactions-per-entry: 128
  ingress-poll-ms: 25
  execution-workers: 4
  rent-base-lamports: 1000
  rent-per-byte-lamports: 10
  recent-blockhash-window: 150

system:
  #数据存储路径 按照网络前缀分类
  path: "/solana/proddb"
  #数据库缓存大小 单位MB 基于LRU策略实现的一级缓存
  db-cache-size: 500
  #节点与节点之间的通信 TCP通信 支持P2P网络
  quic-port: 8333
  is-stun: true
  stun-port: 3479
  stun-address:
    - '127.0.0.1:3479'
  web-socket: 28333
  #用户在启动时可以配置公钥 对于隐私接口必须签名才能访问 也就是节点所有者
  server-pubkey:
    - ''

logging:
  level:
    root: INFO
